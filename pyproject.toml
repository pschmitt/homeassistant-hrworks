[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hrworks-browser-worker"
version = "1.0.0"
description = "Browser connection for the Home Assistant HR WORKS integration"
requires-python = ">=3.12"
dependencies = ["playwright==1.63.0"]
license = "MIT"

[project.scripts]
hrworks-worker = "hrworks_worker.server:main"

[tool.hatch.build.targets.wheel]
packages = ["hrworks_worker"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]
