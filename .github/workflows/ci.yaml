name: Checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.15'
      - run: pip install ruff aiohttp rich typer browser-daemon-client==0.10.0
      - run: ruff check .
      - run: ruff format --check .
      - run: |
          mkdir -p /tmp/dev && ln -s "$PWD/custom_components/hrworks/hrworks" /tmp/dev/hrworks
          echo "PYTHONPATH=$PWD:/tmp/dev" >> "$GITHUB_ENV"
      - run: python -m unittest discover -s tests -v
      - run: pip install build
      - run: python -m build
      - run: pip install --force-reinstall dist/*.whl
      - run: cd /tmp && env -u PYTHONPATH hrworks --version --json
      - run: cd /tmp && env -u PYTHONPATH hrworks completion bash

  scripts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests/js
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tests/js/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master
  homeassistant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.15'
      - run: pip install homeassistant==2026.10.4 browser-daemon-client==0.10.0
      - run: |
          mkdir -p /tmp/dev && ln -s "$PWD/custom_components/hrworks/hrworks" /tmp/dev/hrworks
          echo "PYTHONPATH=$PWD:/tmp/dev" >> "$GITHUB_ENV"
      - run: python -m unittest discover -s tests/ha -v
